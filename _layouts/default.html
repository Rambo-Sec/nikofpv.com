<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <script>
    // Handed to main.js. youtubeApiKey is a browser (HTTP-referrer restricted)
    // key, so it's fine for it to live in the built HTML - see SETUP.md.
    window.NIKO_CONFIG = {
      youtubeApiKey: {{ site.youtube_api_key | jsonify }},
      uploadsPlaylistId: {{ site.youtube_uploads_playlist | jsonify }},
      channelUrl: {{ site.youtube_url | jsonify }}
    };
  </script>

  {{ content }}

  <footer id="contact" class="site-footer">
    <div class="wrap footer-row">
      <div>Niko FPV</div>

      <div class="footer-links">
        <a class="button" href="mailto:{{ site.email }}">{{ site.email }}</a>
        <a class="button" href="{{ site.youtube_url }}">YouTube</a>
        <a class="button" href="{{ site.tiktok_url }}">TikTok</a>
      </div>
    </div>
  </footer>

  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</body>
</html>
